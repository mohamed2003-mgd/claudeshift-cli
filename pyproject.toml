[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claudeshift-cli"
version = "0.1.0"
description = "Fast local-first profile switcher, MCP vault, and real-time quota radar for Claude Code, OpenAI Codex CLI, Gemini CLI, and Cursor."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Mohamed Aboelmaged" },
]
keywords = [
    "claude",
    "claude-code",
    "codex",
    "gemini-cli",
    "cursor",
    "mcp",
    "cli",
    "profile-switcher",
    "quota-monitor",
    "ai-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "build>=1.2.0",
    "twine>=5.1.0",
]

[project.urls]
Homepage = "https://github.com/mohamed2003-mgd/claudeshift-cli"
Repository = "https://github.com/mohamed2003-mgd/claudeshift-cli"
Issues = "https://github.com/mohamed2003-mgd/claudeshift-cli/issues"

[project.scripts]
claudeshift = "claudeshift.cli:app"
claudeshift-cli = "claudeshift.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]